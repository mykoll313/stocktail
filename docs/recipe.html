<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10252e">
<title>Stocktail | Your Cocktail Recipe</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#10252e;background:#f8f5ec}
*{box-sizing:border-box}body{margin:0}.top{background:#10252e;color:white;padding:17px 20px;font-weight:900;letter-spacing:.12em}.top span{color:#d39a28}
main{max-width:720px;margin:auto;padding:18px 16px 55px}.hero{width:100%;max-height:330px;object-fit:cover;border-radius:16px;background:#10252e}
h1{font-family:Georgia,serif;font-size:2.3rem;margin:15px 0 5px}.desc{color:#59666b;line-height:1.5}
.card{background:white;border:1px solid #ddd8cc;border-radius:14px;padding:18px;margin-top:18px}
h2{font-size:1.05rem;letter-spacing:.05em;margin:0 0 12px}.item{padding:12px 0;border-top:1px solid #eee;overflow-wrap:anywhere}
.item:first-of-type{border-top:0}.amount{color:#a66d0c;font-weight:750}.product{margin-top:5px;font-weight:650}
.loc{color:#2e7d45;font-size:.9rem;margin-top:3px}.muted{color:#59666b;font-size:.9rem}
ol{padding-left:22px;line-height:1.6}li{padding-bottom:8px}
.status{padding:22px;text-align:center}.warn{background:#fff3db;border-radius:9px;padding:10px;margin-top:14px}
button{background:#10252e;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
footer{color:#59666b;font-size:.8rem;margin-top:26px;text-align:center}
</style>
</head>
<body>
<header class="top">STOCK<span>TAIL</span></header>
<main id="app"><div class="card status" role="status">Loading your recipe…</div></main>
<script>
"use strict";
// This is a public publishable key, NOT a service-role or secret key.
const SUPABASE_URL = "https://mzajcasbnupvmncdizti.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_I2_StEDOjJ4sIj3ZpENZ9w_9JT40_Fk";
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const cocktailId = Number(params.get("cocktail_id"));
const list = value => Array.isArray(value) ? value : [];
const record = value => value !== null && typeof value === "object" && !Array.isArray(value);
const owns = (obj,key) => Object.prototype.hasOwnProperty.call(obj,String(key));
const nameOf = ing => ing.displayName || ing.ingredientName || "Ingredient";
function el(tag, className, value) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (value !== undefined && value !== null) node.textContent = String(value);
  return node;
}
function fail(message) {
  app.replaceChildren();
  const card=el("section","card status");
  card.append(el("h2","", "Recipe unavailable"),el("p","",message));
  const retry=el("button","","Try again");
  retry.addEventListener("click",load);
  card.append(retry);app.append(card);
}
function selections(parameter) {
  const encoded=params.get(parameter);
  if (!encoded) return {};
  try {
    if (encoded.length>16000) return {};
    const normalized=encoded.replace(/-/g,"+").replace(/_/g,"/");
    const binary=atob(normalized);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const obj=JSON.parse(new TextDecoder().decode(bytes));
    return record(obj) ? obj : {};
  } catch {return {};}
}
function directions(value) {
  if (Array.isArray(value)) return value.map(String).filter(Boolean);
  if (typeof value!=="string") return [];
  const s=value.trim();
  if (!s) return [];
  try {const a=JSON.parse(s);if(Array.isArray(a))return a.map(String).filter(Boolean);}catch{}
  return s.split(/\r?\n/).map(x=>x.replace(/^\s*\d+[.)]\s*/,"").trim()).filter(Boolean);
}
function imageUrl(path) {
  if (!path || typeof path!=="string")return "";
  if (/^https:\/\//i.test(path))return path;
  const relative=path.replace(/^\/+/,"").replace(/^cocktail-images\//,"");
  return `${SUPABASE_URL}/storage/v1/object/public/cocktail-images/${relative.split("/").map(encodeURIComponent).join("/")}`;
}
function locationText(locations) {
  return list(locations).map(l=>{
    if (!record(l))return "";
    if (l.locationLabel)return String(l.locationLabel);
    return [l.aisle&&`Aisle ${l.aisle}`,l.section&&`Section ${l.section}`,l.shelf&&`Shelf ${l.shelf}`,l.position&&`Position ${l.position}`].filter(Boolean).join(" • ");
  }).filter(Boolean).join(" / ");
}
function ingredientGroups(cocktail) {
  if (Array.isArray(cocktail.ingredientGroups)) {
    return cocktail.ingredientGroups.filter(record).map((group,index)=>({
      ...group,
      requirementKey:group.requirementKey || `response_group_${index}`,
      alternatives:list(group.alternatives).filter(record)
    })).filter(group=>group.alternatives.length);
  }
  // Older RPC responses: use explicit group IDs, never matching ingredient names.
  const grouped=new Map();
  for (const ing of list(cocktail.ingredients).filter(record)) {
    const key=ing.requirementGroup !== null && ing.requirementGroup !== undefined
      ? `group_${ing.requirementGroup}` : `row_${ing.cocktailIngredientId ?? ing.ingredientId}`;
    if (!grouped.has(key)) grouped.set(key,{requirementKey:key,alternatives:[]});
    grouped.get(key).alternatives.push(ing);
  }
  return [...grouped.values()].map(group=>({
    ...group,blocking:group.alternatives.some(ing=>ing.blocking === true ||
      (ing.required === true && ing.garnish !== true))
  }));
}
function hasStock(product) {
  return product.quantityOnHand === null || product.quantityOnHand === undefined ||
    Number(product.quantityOnHand)>0;
}
function isAvailable(ing) {
  if (typeof ing.available === "boolean") return ing.available;
  if (ing.status) return ing.status === "inStock" || ing.status === "alwaysAvailable";
  return list(ing.products).filter(record).some(hasStock);
}
function resolveSelection(group,items,savedGroups) {
  const alternatives=group.alternatives;
  let ing, requested, explicitProduct=false;
  const saved=owns(savedGroups,group.requirementKey) ? savedGroups[group.requirementKey] : null;
  if (record(saved)) {
    ing=alternatives.find(a=>String(a.cocktailIngredientId ?? a.ingredientId) === String(saved.cocktailIngredientId) &&
      (saved.ingredientId === undefined || String(a.ingredientId) === String(saved.ingredientId)));
    if (!ing) return {ing:null,product:null,notice:"The ingredient selected on the tablet is no longer returned for this group."};
    // A null inventoryId is an intentional choice without a store product.
    requested=saved.inventoryId;
    explicitProduct=true;
  } else {
    // Flutter's items keys are cocktailIngredientId; support older ingredientId keys too.
    ing=alternatives.find(a=>owns(items,a.cocktailIngredientId ?? a.ingredientId));
    if (ing) requested=items[String(ing.cocktailIngredientId ?? ing.ingredientId)];
    else {
      ing=alternatives.find(a=>owns(items,a.ingredientId));
      if (ing) requested=items[String(ing.ingredientId)];
    }
    if (ing) explicitProduct=true;
    if (!ing) ing=alternatives.find(a=>isAvailable(a) && (!group.blocking ||
      a.blocking === true || (a.required === true && a.garnish !== true))) || alternatives[0];
  }
  const products=list(ing.products).filter(record);
  // Preserve a QR selection even if stock changes; never silently swap products.
  const product=explicitProduct
    ? products.find(p=>requested !== null && requested !== undefined && String(p.inventoryId)===String(requested))
    : isAvailable(ing) ? products.find(hasStock) : undefined;
  let notice="";
  if (explicitProduct && requested !== null && requested !== undefined && !product)
    notice="The selected store product is no longer listed for this ingredient. Ask store staff for assistance.";
  else if (product && !hasStock(product))
    notice="The selected store product is currently out of stock.";
  else if (explicitProduct && !isAvailable(ing))
    notice="Availability for this selected ingredient has changed. Ask store staff for assistance.";
  return {ing,product,notice};
}
function render(cocktail) {
  const items=selections("items"), savedGroups=selections("groups");
  app.replaceChildren();
  const src=imageUrl(cocktail.image_path);
  if(src){const img=el("img","hero");img.src=src;img.alt=`${cocktail.cocktail_name} cocktail`;img.onerror=()=>img.remove();app.append(img);}
  app.append(el("h1","",cocktail.cocktail_name||"Cocktail"));
  if(cocktail.description)app.append(el("p","desc",cocktail.description));
  if(cocktail.serving_size)app.append(el("p","muted",`Serving size: ${cocktail.serving_size}`));
  const card=el("section","card");card.append(el("h2","","INGREDIENTS"));
  const groups=ingredientGroups(cocktail);
  for(const group of groups){
    const {ing,product,notice}=resolveSelection(group,items,savedGroups);
    const row=el("div","item");row.dataset.requirementKey=group.requirementKey;
    if(ing){
      const qty=ing.displayQuantity || [ing.requiredQuantity,ing.requiredUnit].filter(x=>x!==null&&x!==undefined&&x!=="").join(" ");
      const heading=el("div");
      if(qty)heading.append(el("span","amount",`${qty}  `));
      heading.append(document.createTextNode(nameOf(ing)));row.append(heading);
      if(product){
        const label=[product.brand,product.productName,[product.packageQuantity,product.packageUnit].filter(x=>x!==null&&x!==undefined&&x!=="").join(" ")].filter(Boolean);
        if(product.brand && product.productName && String(product.productName).toLowerCase().includes(String(product.brand).toLowerCase()))label.shift();
        row.append(el("div","product",label.join(" • ")));
        const place=locationText(product.locations);
        if(place)row.append(el("div","loc",place));
      }else if(!notice){
        row.append(el("div","muted",isAvailable(ing)?"No specific store product required":"Ask staff about availability"));
      }
    }else{
      row.append(el("div","",group.displayLabel || group.alternatives.map(nameOf).join(" OR ")));
    }
    if(notice)row.append(el("div","warn",notice));
    card.append(row);
  }
  if(!groups.length)card.append(el("p","muted","No ingredient details are available."));
  app.append(card);
  const steps=directions(cocktail.instructions);
  const instructions=el("section","card");instructions.append(el("h2","","DIRECTIONS"));
  if(steps.length){const ol=el("ol");steps.forEach(s=>ol.append(el("li","",s)));instructions.append(ol);}
  else instructions.append(el("p","muted","Preparation instructions are not available."));
  app.append(instructions);
  app.append(el("footer","","Product availability and shelf locations may change. Ask store staff for assistance."));
}
async function load(){
  if(!Number.isSafeInteger(cocktailId)||cocktailId<=0){fail("The QR code does not contain a valid cocktail ID.");return;}
  app.replaceChildren(el("div","card status","Loading your recipe…"));
  try{
    const response=await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_stocktail_cocktails`,{
      method:"POST",
      headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json"},
      body:"{}"
    });
    if(!response.ok)throw new Error(`Supabase returned ${response.status}. Check function access and RLS policies.`);
    const data=await response.json();
    const rows=Array.isArray(data)?data:[data];
    const recipe=rows.map(x=>x?.get_stocktail_cocktails??x).find(x=>Number(x?.cocktail_id)===cocktailId);
    if(!recipe){fail("This recipe is not currently available. It may be out of stock.");return;}
    render(recipe);
  }catch(error){fail(`Unable to load the recipe. ${error.message||"Please try again."}`);}
}
load();
</script>
</body>
</html>
